name: NPM Publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: widget-npm-release
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      HAS_DISPATCH_TOKEN: ${{ secrets.WIDGET_RELEASE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check exact committed version
        id: plan
        run: node scripts/release.mjs status
      - name: Build release
        if: steps.plan.outputs.publish == 'true'
        run: |
          test -n "$VITE_SERVER_URL_US" || { echo 'Configure VITE_SERVER_URL_US before publishing'; exit 1; }
          test -n "$VITE_WEBSOCKET_URL_US" || { echo 'Configure VITE_WEBSOCKET_URL_US before publishing'; exit 1; }
          pnpm build
        env:
          VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}
          VITE_SERVER_URL_US: ${{ secrets.VITE_SERVER_URL_US }}
          VITE_SERVER_URL_EU_RESIDENCY: ${{ secrets.VITE_SERVER_URL_EU_RESIDENCY }}
          VITE_SERVER_URL_IN_RESIDENCY: ${{ secrets.VITE_SERVER_URL_IN_RESIDENCY }}
          VITE_WEBSOCKET_URL: ${{ secrets.VITE_WEBSOCKET_URL }}
          VITE_WEBSOCKET_URL_US: ${{ secrets.VITE_WEBSOCKET_URL_US }}
          VITE_WEBSOCKET_URL_EU_RESIDENCY: ${{ secrets.VITE_WEBSOCKET_URL_EU_RESIDENCY }}
          VITE_WEBSOCKET_URL_IN_RESIDENCY: ${{ secrets.VITE_WEBSOCKET_URL_IN_RESIDENCY }}
      - name: Publish exact version
        if: steps.plan.outputs.publish == 'true'
        run: npm publish --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Record GitHub release (safe to retry)
        if: steps.plan.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_COMMIT: ${{ steps.plan.outputs.commit }}
        run: |
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --target "$RELEASE_COMMIT" --title "v$VERSION" --generate-notes
          fi
      - name: Notify downstream repository
        if: steps.plan.outputs.ready == 'true' && env.HAS_DISPATCH_TOKEN == 'true'
        uses: actions/github-script@v8
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        with:
          github-token: ${{ secrets.WIDGET_RELEASE_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'askbenny', repo: 'convai-widget-embed', event_type: 'core-released',
              client_payload: { version: process.env.VERSION }
            });
      - name: Scheduled fallback notice
        if: env.HAS_DISPATCH_TOKEN != 'true'
        run: echo 'Immediate downstream dispatch is not configured; the scheduled sync will detect this release.' >> "$GITHUB_STEP_SUMMARY"
