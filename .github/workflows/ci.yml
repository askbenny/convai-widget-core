name: Widget CI
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SERVER_URL_US: https://voice.test
      VITE_WEBSOCKET_URL_US: wss://voice.test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test --run --browser.headless
      - run: pnpm lint
      - run: pnpm build
