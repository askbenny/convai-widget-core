name: Validate widget
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec vitest run --browser.headless
      - run: pnpm build
      - run: npm pack --ignore-scripts --pack-destination /tmp
      - name: Check the distributable has no install-time source generation
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const source = JSON.parse(readFileSync('package.json'));
          const archive = `/tmp/askbenny-convai-widget-core-${source.version}.tgz`;
          const pkg = JSON.parse(execFileSync('tar', ['-xOf', archive, 'package/package.json']));
          if (pkg.scripts?.postinstall || pkg.scripts?.install || pkg.scripts?.preinstall) {
            throw new Error('The dist-only package must install without source build hooks.');
          }
          JS
